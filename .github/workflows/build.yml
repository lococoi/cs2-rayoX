name: Build cs2-rayoX

# Disparadores:
#  - push de un tag vX.Y  (ej: v1.0)  → compila y publica Release con exe + zip
#  - workflow_dispatch (botón "Run workflow") → solo compila y sube artifacts
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Permiso de escritura necesario para publicar la Release y sus assets.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar con build.bat
        shell: cmd
        run: build.bat

      - name: Verificar ejecutable
        shell: pwsh
        run: |
          if (-not (Test-Path "cs2-rayoX.exe")) {
            Write-Error "No se genero cs2-rayoX.exe"
            exit 1
          }

      - name: Crear ZIP del ejecutable
        shell: pwsh
        run: Compress-Archive -Path "cs2-rayoX.exe" -DestinationPath "cs2-rayoX.zip" -Force

      - name: Subir artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs2-rayoX
          path: |
            cs2-rayoX.exe
            cs2-rayoX.zip
          if-no-files-found: error

      # Publica (o actualiza) los assets en la Release del tag actual.
      # Se usa gh release upload en vez de softprops para evitar la
      # llamada a generate-release-notes (causa de "Resource not
      # accessible by integration").
      - name: Publicar Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" cs2-rayoX.exe cs2-rayoX.zip --clobber
