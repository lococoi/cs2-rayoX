name: Build cs2-rayoX

# Disparadores:
#  - push a main (cambios de código) → compila y publica/actualiza la Release "latest"
#  - push de un tag vX.Y             → compila y publica una Release versionada
#  - workflow_dispatch               → compila y publica/actualiza la Release "latest"
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

# Permiso de escritura necesario para publicar la Release y sus assets.
permissions:
  contents: write

# Serializa los runs de la misma rama/tag para que dos pushes seguidos
# no suban assets a la misma Release al mismo tiempo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar con build.bat
        shell: cmd
        run: build.bat

      - name: Verificar ejecutable
        shell: pwsh
        run: |
          if (-not (Test-Path "cs2-rayoX.exe")) {
            Write-Error "No se genero cs2-rayoX.exe"
            exit 1
          }

      - name: Crear ZIP del ejecutable
        shell: pwsh
        run: Compress-Archive -Path "cs2-rayoX.exe" -DestinationPath "cs2-rayoX.zip" -Force

      - name: Subir artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs2-rayoX
          path: |
            cs2-rayoX.exe
            cs2-rayoX.zip
          if-no-files-found: error

      # Publica una Release en cada cambio de código:
      #  - tag vX.Y → Release versionada con ese tag.
      #  - main      → Release rodante "latest" (se actualiza en cada push).
      # Se usa gh (en vez de softprops) para evitar generate-release-notes,
      # que provocaba "Resource not accessible by integration".
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="cs2-rayoX ${TAG}"
            NOTES="Release ${TAG}. Commit: ${COMMIT_URL}"
          else
            TAG="latest"
            TITLE="cs2-rayoX build ${SHORT_SHA}"
            NOTES="Build automático de ${SHORT_SHA} (${GITHUB_REF_NAME}). Commit: ${COMMIT_URL}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" cs2-rayoX.exe cs2-rayoX.zip --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              gh release create "$TAG" cs2-rayoX.exe cs2-rayoX.zip \
                --title "$TITLE" \
                --notes "$NOTES" \
                --draft=false \
                --latest
            else
              gh release create "$TAG" cs2-rayoX.exe cs2-rayoX.zip \
                --title "$TITLE" \
                --notes "$NOTES" \
                --draft=false \
                --prerelease=false \
                --latest
            fi
          fi
